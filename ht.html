    <style>
        /* Global styles & 3D photo wall */
        :root {
            --body-bg: #f5f8f6;
            --base-font-size: 16px;
            --column-height: 300px;
            --image-height: 200px;
            --image-width: 200px;
            --row-gap: 0.5em;
            --column-gap: 0.25em;
            --number-of-images: 10;
            --number-of-columns: 5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f8f6;
            font-family: 'Inter', 'Outfit', system-ui, sans-serif;
            overflow-x: hidden;
        }

        /* 3D Wall Component Styles */
        .column-wrapper {
            width: 700px;
            height: 300px;
            perspective: 1000px;
            position: sticky;
            top: calc(50vh - 300px);
            overflow: clip;
            margin: 0 auto;
        }

        .columns {
            position: absolute;
            width: 175%;
            top: -300px;
            right: -700px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            transform: rotateX(45deg) rotateY(20deg) rotate(-25deg) translate3d(-6em, 8em, 8em);
            transform-origin: 50%;
            transform-style: preserve-3d;
            mask-image: linear-gradient(
                #0000 0%,
                #00000005 2.3%,
                #00000009 2.57%,
                #00000013 3.65%,
                #00000026 5.25%,
                #0000004d 7.5%,
                #000 15%
            );
        }

        .column {
            display: flex;
            flex-direction: column;
            margin-left: var(--column-gap);
            margin-right: var(--column-gap);
        }

        .column div {
            height: 200px;
            margin-bottom: var(--row-gap);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .column div:hover {
            transform: scale(1.03);
            filter: brightness(1.08);
        }

        .column:nth-child(1) { padding-top: 100px; }
        .column:nth-child(2) { padding-top: 50px; }
        .column:nth-child(3) { padding-top: 0px; }
        .column:nth-child(4) { padding-top: 100px; }
        .column:nth-child(5) { padding-top: 50px; }

        .up {
            animation: imageScrollingUp 25s linear infinite alternate;
        }

        .down {
            animation: imageScrollingDown 25s linear infinite alternate;
        }

        @keyframes imageScrollingUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(calc(-1 * (((200px + 0.5em) * 10) - 300px))); }
        }

        @keyframes imageScrollingDown {
            0% { transform: translateY(calc(-1 * (((200px + 0.5em) * 10) - 300px))); }
            100% { transform: translateY(0); }
        }

        /* Custom styles */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #2E8B57;
            border-radius: 10px;
        }

        .glass-nav {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        .btn-donate {
            background: linear-gradient(135deg, #2E8B57, #1f6e46);
            transition: all 0.2s ease;
        }

        .btn-donate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(46,139,87,0.4);
        }

        .hero-gradient {
            background: radial-gradient(100% 80% at 50% 0%, rgba(46,139,87,0.12), transparent 70%);
        }

        footer a:hover {
            color: #F9A825;
        }
    </style>
