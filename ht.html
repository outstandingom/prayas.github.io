<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NGO Impact Wall | 3D Photo Gallery</title>
    <!-- Google Fonts + Tailwind CSS + Framer Motion CDN for React compatibility -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Override Tailwind to respect custom theme later but we'll inject custom CSS for main component -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Outfit:wght@300;400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <!-- React & ReactDOM & React Router & Framer Motion -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-router-dom@6.20.0/umd/react-router-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Global overrides & custom variables + 3D photo wall styles from requirement */
        :root {
            --body-bg: #000;
            --base-font-size: 16px;
            --column-height: 300px;
            --image-height: 200px;
            --image-width: 200px;
            --row-gap: 0.5em;
            --column-gap: 0.25em;
            --number-of-images: 10;
            --number-of-columns: 5;
            /* NGO theme colors */
            --navy: #0B2E63;
            --emerald: #2E8B57;
            --gold: #F9A825;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f5f8f6;
            font-family: 'Inter', 'Outfit', system-ui, sans-serif;
            overflow-x: hidden;
        }
        /* Custom 3D wall component styles from requirement - enhanced with NGO photos later */
        .ngo-photo-wall {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 500px;
        }
        .column-wrapper {
            width: 700px;
            height: 300px;
            perspective: 1000px;
            position: sticky;
            top: calc(50vh - var(--column-height));
            overflow: clip;
            margin: 0 auto;
        }
        .columns {
            position: absolute;
            width: 175%;
            top: -300px;
            right: -700px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            transform: rotateX(45deg) rotateY(20deg) rotate(-25deg) translate3d(-6em, 8em, 8em);
            transform-origin: 50%;
            transform-style: preserve-3d;
            mask-image: linear-gradient(
                #0000 0%,
                #00000005 2.3%,
                #00000009 2.57%,
                #00000013 3.65%,
                #00000026 5.25%,
                #0000004d 7.5%,
                #000 15%
            );
        }
        .column {
            display: flex;
            flex-direction: column;
            margin-left: var(--column-gap);
            margin-right: var(--column-gap);
        }
        .column div {
            height: 200px;
            margin-bottom: var(--row-gap);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .column div:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }
        .column:nth-child(1) { padding-top: 100px; }
        .column:nth-child(2) { padding-top: 50px; }
        .column:nth-child(3) { padding-top: 0px; }
        .column:nth-child(4) { padding-top: 100px; }
        .column:nth-child(5) { padding-top: 50px; }

        .up {
            animation: imageScrollingUp 25s linear infinite alternate;
        }
        .down {
            animation: imageScrollingDown 25s linear infinite alternate;
        }

        @keyframes imageScrollingUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(calc(-1 * (((var(--image-height) + var(--row-gap)) * var(--number-of-images)) - var(--column-height)))); }
        }
        @keyframes imageScrollingDown {
            0% { transform: translateY(calc(-1 * (((var(--image-height) + var(--row-gap)) * var(--number-of-images)) - var(--column-height)))); }
            100% { transform: translateY(0); }
        }

        /* custom scrollbar hide */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #2E8B57;
            border-radius: 10px;
        }
        .glass-nav {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .btn-donate {
            background: linear-gradient(135deg, #2E8B57, #1f6e46);
            transition: all 0.2s ease;
        }
        .btn-donate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(46,139,87,0.4);
        }
        .hero-gradient {
            background: radial-gradient(100% 80% at 50% 0%, rgba(46,139,87,0.12), transparent 70%);
        }
        footer a:hover {
            color: #F9A825;
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">

    const { BrowserRouter, Routes, Route, Link, useLocation } = ReactRouterDOM;

    // --------------------------------------------------------------

        "https://images.pexels.com/photos/3985221/pexels-photo-3985221.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // vaccination drive
        "https://images.pexels.com/photos/256541/pexels-photo-256541.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // shelter home
        "https://images.pexels.com/photos/5428830/pexels-photo-5428830.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // recycling
        "https://images.pexels.com/photos/2387795/pexels-photo-2387795.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // feeding program

        "https://images.pexels.com/photos/5673501/pexels-photo-5673501.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // dental checkup
        "https://images.pexels.com/photos/5202401/pexels-photo-5202401.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // animal rescue

        "https://images.pexels.com/photos/3772687/pexels-photo-3772687.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // library for kids
        "https://images.pexels.com/photos/5699463/pexels-photo-5699463.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // sports for development
        "https://images.pexels.com/photos/7092446/pexels-photo-7092446.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // skill development
        "https://images.pexels.com/photos/4145357/pexels-photo-4145357.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // remote education
        "https://images.pexels.com/photos/8499459/pexels-photo-8499459.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // green earth
        "https://images.pexels.com/photos/7041675/pexels-photo-7041675.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // wheelchair donation
        "https://images.pexels.com/photos/7655078/pexels-photo-7655078.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // art therapy

        "https://images.pexels.com/photos/6460436/pexels-photo-6460436.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // seed planting
        "https://images.pexels.com/photos/3912791/pexels-photo-3912791.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // mother child care
        "https://images.pexels.com/photos/7549982/pexels-photo-7549982.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // women farmers
        "https://images.pexels.com/photos/7680444/pexels-photo-7680444.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // charity event
        "https://images.pexels.com/photos/3671392/pexels-photo-3671392.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // mental health
        "https://images.pexels.com/photos/4398099/pexels-photo-4398099.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // group of volunteers
        "https://images.pexels.com/photos/7655631/pexels-photo-7655631.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop", // building homes
        "https://images.pexels.com/photos/8580725/pexels-photo-8580725.jpeg?auto=compress&cs=tinysrgb&w=600&h=600&fit=crop" // zero waste
    ];
    
    // Ensure we have exactly 50 images, repeat if needed, but we have enough 50 distinct.
    const finalPhotos = ngoPhotoSet.slice(0, 50);
    
    // Distribute images to columns (5 columns, each column gets 10 images)
    const getColumnImages = () => {
        let columns = [[], [], [], [], []];
        finalPhotos.forEach((img, idx) => {
            const colIdx = idx % 5;
            columns[colIdx].push(img);
        });
        return columns;
    };
    
    const columnsData = getColumnImages();
    // Alternate up/down classes based on column index
    const columnClasses = ["up", "down", "up", "down", "up"];
    
    // Main 3D Photo Wall Component (NGO photos)
    const NGOWall3D = () => {
        return (
            <div className="ngo-photo-wall">
                <div className="column-wrapper">
                    <div className="columns">
                        {columnsData.map((colImages, colIndex) => (
                            <div key={colIndex} className={`column ${columnClasses[colIndex]}`}>
                                {colImages.map((imgUrl, imgIdx) => (
                                    <div 
                                        key={imgIdx} 
                                        style={{ backgroundImage: `url(${imgUrl})` }}
                                        title="NGO impact in action"
                                    ></div>
                                ))}
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );
    };
    
    // Layout component with navbar, outlet
    const Layout = () => {
        const location = useLocation();
        return (
            <div className="min-h-screen flex flex-col">
                <nav className="glass-nav fixed w-full z-50 top-0 py-4 px-6 md:px-12 shadow-sm">
                    <div className="max-w-7xl mx-auto flex justify-between items-center">
                        <Link to="/" className="text-2xl font-bold bg-gradient-to-r from-emerald-700 to-emerald-500 bg-clip-text text-transparent">Hope<span className="text-gold-500">Bridge</span></Link>
                        <div className="hidden md:flex space-x-8 font-medium text-gray-700">
                            <Link to="/" className="hover:text-emerald-600 transition">Home</Link>
                            <Link to="/about" className="hover:text-emerald-600 transition">About</Link>
                            <Link to="/programs" className="hover:text-emerald-600 transition">Programs</Link>
                            <Link to="/gallery" className="hover:text-emerald-600 transition">Gallery</Link>
                            <Link to="/stories" className="hover:text-emerald-600 transition">Stories</Link>
                            <Link to="/contact" className="hover:text-emerald-600 transition">Contact</Link>
                        </div>
                        <Link to="/donate" className="btn-donate px-6 py-2 rounded-full text-white font-semibold shadow-md">Donate Now</Link>
                    </div>
                </nav>
                <main className="flex-grow pt-20">
                    <AnimatePresence mode="wait">
                        <Routes location={location} key={location.pathname}>
                            <Route path="/" element={<Home />} />
                            <Route path="/about" element={<About />} />
                            <Route path="/programs" element={<Programs />} />
                            <Route path="/gallery" element={<Gallery />} />
                            <Route path="/stories" element={<Stories />} />
                            <Route path="/donate" element={<Donate />} />
                            <Route path="/contact" element={<Contact />} />
                        </Routes>
                    </AnimatePresence>
                </main>
                <footer className="bg-navy-900 text-white py-10 px-6 bg-[#0B2E63]">
                    <div className="max-w-7xl mx-auto grid md:grid-cols-4 gap-8">
                        <div><h3 className="font-bold text-xl mb-2">HopeBridge</h3><p className="text-gray-300">Empowering communities worldwide.</p></div>
                        <div><h4 className="font-semibold mb-3">Explore</h4><ul className="space-y-1 text-gray-300"><li><Link to="/about">About Us</Link></li><li><Link to="/programs">Programs</Link></li><li><Link to="/contact">Contact</Link></li></ul></div>
                        <div><h4 className="font-semibold mb-3">Support</h4><ul className="space-y-1 text-gray-300"><li><Link to="/donate">Donate</Link></li><li><Link to="/stories">Impact Stories</Link></li></ul></div>
                        <div><h4 className="font-semibold mb-3">Connect</h4><p className="text-gray-300">hello@hopebridge.org</p><p>+1 (800) 123-HOPE</p></div>
                    </div>
                </footer>
            </div>
        );
    };
    
    // Homepage with the 3D NGO photo wall
    const Home = () => {
        return (

                {/* Hero Section */}
                <section className="relative hero-gradient overflow-hidden pt-6 pb-12 md:py-20">
                    <div className="max-w-7xl mx-auto px-6 md:px-12 grid lg:grid-cols-2 gap-12 items-center">
                        <motion.div initial={{ y: 40, opacity: 0 }} animate={{ y: 0, opacity: 1 }} transition={{ delay: 0.2 }}>

    // Dummy pages for routing
    const About = () => <div className="max-w-5xl mx-auto py-24 px-6"><h1 className="text-4xl font-bold">About Us</h1><p className="mt-4">We are a global NGO dedicated to uplifting communities.</p></div>;
    const Programs = () => <div className="max-w-5xl mx-auto py-24 px-6"><h1 className="text-4xl font-bold">Programs</h1><p className="mt-4">Education, Healthcare, Environment, Women Empowerment.</p></div>;
    const Gallery = () => <div className="max-w-5xl mx-auto py-24 px-6"><h1 className="text-4xl font-bold">Photo Gallery</h1><div className="grid grid-cols-3 gap-4 mt-8">{finalPhotos.slice(0,9).map((p,i)=><img key={i} src={p} className="rounded-xl shadow-md h-48 object-cover w-full"/>)})</div></div>;
    const Stories = () => <div className="max-w-5xl mx-auto py-24 px-6"><h1 className="text-4xl font-bold">Impact Stories</h1><p>Real change, real people.</p></div>;
    const Donate = () => <div className="max-w-3xl mx-auto py-24 px-6 text-center"><h1 className="text-4xl font-bold">Support Our Mission</h1><p className="mt-4">Every contribution matters.</p><button className="mt-6 bg-emerald-600 text-white px-12 py-4 rounded-full text-xl">Donate via secure gateway</button></div>;
    const Contact = () => <div className="max-w-3xl mx-auto py-24 px-6"><h1 className="text-4xl font-bold">Contact</h1><p>Email: hello@hopebridge.org | Phone: +1 800 555 0192</p></div>;
    
    // Main App render
    const App = () => {
        return (
            <BrowserRouter>
                <Layout />
            </BrowserRouter>
        );
    };
    
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
